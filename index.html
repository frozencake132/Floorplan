<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Floorplan Sketchpad</title>
<meta name="description" content="Sketch house floor plans with exact measurements, on your phone or computer.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbfdfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#122a41" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Floorplan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height drafting workspace. Tool rail | drawing sheet | inspector. Phone: sheet, inspector drawer, tool strip. */
:root{
  --paper:#e6edf0; --sheet:#f5f8f9; --panel:#fbfdfd; --ink:#1b2832; --wall:#1b2832; --muted:#5a6b76; --line:#cfd9de;
  --grid:#dde5e9; --grid-major:#bccbd2; --furn:#ffffff; --sdim:#1d63c7; --accent:#e4570f; --accent-soft:rgba(228,87,15,.13); --accent-ink:#ffffff;
  --ok:#2f8a57; --warn:#b7791f; --danger:#c2412d; --shadow:0 8px 28px rgba(27,40,50,.16);
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Architects Daughter","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1c2c; --sheet:#0f253a; --panel:#122a41; --ink:#e2edf6; --wall:#e2edf6; --muted:#8fa9be; --line:#25445f;
  --grid:#15324c; --grid-major:#21476a; --furn:#1c3a57; --sdim:#6cb4ff; --accent:#ff8b42; --accent-soft:rgba(255,139,66,.18); --accent-ink:#1c0d03;
  --ok:#5cc58a; --warn:#e4b04c; --danger:#ff7a63; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1c2c; --sheet:#0f253a; --panel:#122a41; --ink:#e2edf6; --wall:#e2edf6; --muted:#8fa9be; --line:#25445f;
  --grid:#15324c; --grid-major:#21476a; --furn:#1c3a57; --sdim:#6cb4ff; --accent:#ff8b42; --accent-soft:rgba(255,139,66,.18); --accent-ink:#1c0d03;
  --ok:#5cc58a; --warn:#e4b04c; --danger:#ff7a63; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;overscroll-behavior:none}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.top,.tools,.hist,.zoom,.insp-head,.scalebar{user-select:none;-webkit-user-select:none}
body{overscroll-behavior:none;touch-action:pan-x pan-y}
.top,.tools,.hist,.zoom,.hint,.insp,.modal,.toast{touch-action:pan-x pan-y}
#cv{-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-height:54px}
.brand{display:flex;align-items:center;gap:8px;font:700 15px/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mark{width:22px;height:22px;border:2.5px solid var(--ink);position:relative;flex:none}
.mark::after{content:"";position:absolute;right:-2.5px;top:6px;width:2.5px;height:7px;background:var(--panel)}
.mark::before{content:"";position:absolute;left:8px;top:-2.5px;bottom:-2.5px;width:2.5px;background:var(--ink)}
.divider{width:1px;height:24px;background:var(--line)}
.plan-btn{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;padding:6px 8px;border-radius:8px;font:600 17px/1.1 var(--f-cond);letter-spacing:.02em;min-width:0}
.plan-btn:hover{border-color:var(--line)}
.plan-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.plan-btn svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.sync{display:flex;align-items:center;gap:6px;font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="synced"] i{background:var(--ok)}
.sync[data-s="saving"] i,.sync[data-s="pending"] i{background:var(--warn)}
.sync[data-s="error"] i,.sync[data-s="big"] i{background:var(--danger)}
.spacer{flex:1}
.tb{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font:600 14px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;flex:none}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.tb:hover{background:var(--accent-soft)}
.stairpick{display:flex;gap:4px}
.people{display:flex;align-items:center;flex:none}
.people .av{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 11px var(--f-ui);border:2px solid var(--panel);margin-left:-8px}
.people .av:first-child{margin-left:0}
.people .av.more{background:var(--muted)}
.ppl-t{font:600 12px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-left:6px;white-space:nowrap}
.share-btn{color:var(--ink)}
.copyrow{display:flex;gap:6px;min-width:0}
.copyrow input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:0 10px;font:12.5px var(--f-mono)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:middle}
.badge.shb{color:var(--ok)}
.ib{width:38px;height:38px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;flex:none;padding:0}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--accent-soft)}
.ib:disabled{opacity:.35;cursor:default;background:var(--panel)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:68px minmax(0,1fr) 312px}
.tools{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:thin}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border:0;background:none;color:var(--muted);border-radius:8px;font:600 10.5px/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;flex:none}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{color:var(--ink);background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tool .chip{width:22px;height:22px;border-radius:6px;background:var(--c);border:2px solid var(--panel);outline:1px solid var(--line)}
.tsep{height:1px;background:var(--line);margin:4px 6px;flex:none}

.stage{position:relative;min-width:0;min-height:0;background:var(--sheet);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#cv.pan{cursor:grab} #cv.cross{cursor:crosshair}

.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);z-index:2}
.hint{pointer-events:none}
.hint button,.hint input,.hint label,.hint select,.hint .swb{pointer-events:auto}
.hint b{color:var(--ink);font:600 13px var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.hint .btn{padding:5px 9px}
.hint .sw{grid-template-columns:repeat(8,24px)}
.hint .swb{width:24px;height:24px}
.pw{display:flex;gap:4px}
.pw button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;font:600 12px var(--f-cond);letter-spacing:.04em}
.pw button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.hist{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.hist button{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border:0;background:none;color:var(--ink);font:600 14px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;touch-action:manipulation}
.hist button+button{border-left:1px solid var(--line)}
.hist button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hist button:hover{background:var(--accent-soft)}
.hist button:active{background:var(--accent-soft)}
.hist button[aria-disabled="true"]{color:var(--muted);opacity:.55}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom .ib{box-shadow:var(--shadow)}
.scalebar{position:absolute;left:14px;bottom:70px;z-index:2;pointer-events:none;font:500 11px var(--f-mono);color:var(--muted);display:flex;flex-direction:column;gap:3px}
.scalebar div{height:6px;border:2px solid var(--ink);border-top:0}

/* inspector */
.insp{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.insp-head{display:flex;align-items:center;gap:8px;border:0;background:none;padding:14px 16px 10px;text-align:left;border-bottom:1px solid var(--line);cursor:default}
.insp-head .t{font:700 13px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.insp-head .s{font:600 17px var(--f-cond);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.insp-head svg{display:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.insp-body{overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font:600 11px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:0 10px;min-width:0}
.fld textarea{height:auto;min-height:60px;padding:8px 10px;resize:vertical;font-family:var(--f-ui)}
.fld input.num{font-family:var(--f-mono);font-size:13px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.sec h3{margin:0;font:700 12px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px;font:600 13px/1.1 var(--f-cond);letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.stat span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.walls{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:6px;align-items:center}
.wrow b{font:700 13px var(--f-mono);color:var(--accent);text-align:center}
.fld input[data-locked],.wrow input[data-locked]{border-style:dashed;border-color:var(--sdim);color:var(--sdim);background:transparent}
.sdprev{font:500 12px var(--f-mono);color:var(--sdim);min-width:0}
.sdprev[data-bad="true"]{color:var(--danger)}
.sdin{width:120px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:0 8px;font:13px var(--f-mono);color:var(--ink)}
.wrow input{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:0 8px;font:13px var(--f-mono);min-width:0;width:100%}
.wrow .btn{padding:5px 7px;font-size:12px}
.sw{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.swb{aspect-ratio:1;width:100%;max-width:100%;border-radius:6px;border:2px solid var(--panel);outline:1px solid var(--line);background:var(--c);padding:0;position:relative}
.swb.on{outline:2px solid var(--accent)}
.swb.custom{background:conic-gradient(#e85d5d,#f2c66d,#9fd1a8,#8fb8de,#bba6e0,#e85d5d);cursor:pointer;display:block}
.swb.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.compass{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,34px);gap:4px;justify-content:start}
.compass .btn{padding:0}
.compass .mid{display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;font:600 10px var(--f-cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:0;padding:0;list-style:none}
.links li{display:flex;justify-content:space-between;gap:8px}
.links li span:last-child{color:var(--muted);font-size:12px}
.lib{display:flex;flex-direction:column;gap:14px}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lib-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 10px;text-align:left}
.lib-item:hover{border-color:var(--accent)}
.lib-item b{font:600 14px var(--f-cond);letter-spacing:.02em}
.lib-item span{font:11px var(--f-mono);color:var(--muted)}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mrow .chip{width:22px;height:22px;border-radius:5px;background:var(--c);outline:1px solid var(--line);border:2px solid var(--panel)}
.mrow .pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow .pn b{font:600 15px var(--f-cond);letter-spacing:.02em;overflow-wrap:anywhere}
.mrow .pn span{font:11px var(--f-mono);color:var(--muted)}
.mrow .btn{padding:6px 8px;font-size:12.5px}
.lnk{font-size:12px;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.badge{font-style:normal;font:600 10px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px}
details.cat summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.cat summary::before{content:"▸";color:var(--muted);font-size:12px}
details.cat[open] summary::before{content:"▾"}
kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--sheet)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:grid;place-items:center;z-index:20;padding:16px}
.dlg.wide{width:min(940px,100%)}
.fpi-wrap{flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:manipulation}
#fpi-cv{display:block;margin:0 auto;max-width:100%;cursor:crosshair}
.dlg-b>*{flex-shrink:0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.45;color:var(--muted)}
.fpi-busy{display:flex;align-items:center;justify-content:center;gap:12px;padding:44px 0;font:600 16px var(--f-cond);letter-spacing:.04em}
.spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fpi-stats{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 14px var(--f-cond);letter-spacing:.03em}
.k{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:-4px}
.k-w{background:var(--accent)}.k-d{background:var(--sdim)}.k-n{background:var(--ok)}.k-o{background:var(--muted)}
.note.err{color:var(--danger)}
#bgimg{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;user-select:none;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #bgimg{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}}
:root[data-theme="dark"] #bgimg{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:84%;display:flex;flex-direction:column;min-height:0}
.dlg-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font:700 18px var(--f-cond);letter-spacing:.04em;flex:1}
.dlg-b{padding:14px 16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.prow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.prow.cur{border-color:var(--accent);background:var(--accent-soft)}
.prow .pn{flex:1;min-width:120px;display:flex;flex-direction:column;gap:2px}
.prow .pn b{font:600 15px var(--f-cond);letter-spacing:.02em;overflow-wrap:anywhere}
.prow .pn span{font:11px var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

@media (max-width:760px){
  .brand-t,.sync-t,.brand,.tb span{display:none}
  .top{gap:6px}
  .tb{padding:0 9px}
  .plan-btn span{max-width:30vw}
  #save-btn,.ppl-t{display:none}
  .people .av:nth-child(n+3){display:none}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}
  .stage{grid-row:1}
  .insp{grid-row:2;border-left:0;border-top:1px solid var(--line)}

// ---------- state ----------
let plans={},cur=null,sel=null,tool='select',view={s:3,x:0,y:0};

// ---------- geometry ----------
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],mul:(a,k)=>[a[0]*k,a[1]*k],dot:(a,b)=>a[0]*b[0]+a[1]*b[1],

function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1];}return a/2;}

  for(let k=1;k<10;k++){const y=b[1]+(b[3]-b[1])*k/10;const xs=[];for(let i=0;i<p.length;i++){const a=p[i],q=p[(i+1)%p.length];if((a[1]>y)!==(q[1]>y))xs.push(a[0]+(y-a[1])*(q[0]-a[0])/(q[1]-a[1]));}
    xs.sort((m,n)=>m-n);for(let i=0;i+1<xs.length;i+=2){if(xs[i+1]-xs[i]>bw){bw=xs[i+1]-xs[i];best=[(xs[i]+xs[i+1])/2,y];}}}

// ---------- units ----------
function fmtLen(v){if(S().unit==='metric'){const cm=v*2.54;return Math.abs(cm)>=100?(cm/100).toFixed(2)+' m':Math.round(cm)+' cm';}

// Smart length reader. Understands 12' 6", 12ft 6in, 12-6, 6 1/2", 12.5 ft, 1200 cm, 3.8m, 4 yd...

function smartLen(str,ref,small){if(str==null)return null;let s=String(str).trim().toLowerCase().replace(/[′’‘`´]/g,"'").replace(/[″“”]/g,'"').replace(/''/g,'"')
    .replace(/(\d)\s*½/g,'$1 1/2').replace(/(\d)\s*¼/g,'$1 1/4').replace(/(\d)\s*¾/g,'$1 3/4').replace(/½/g,'1/2').replace(/¼/g,'1/4').replace(/¾/g,'3/4').replace(/(\d),(\d)/g,'$1.$2').replace(/\band\b/g,' ').replace(/^=/,'');
  if(!s)return null;
  const re=/(\d+(?:\.\d+)?\s+\d+\/\d+|\d+\/\d+|\d*\.\d+|\d+)\s*(millimet(?:er|re)s?|mm|centimet(?:er|re)s?|cm|met(?:er|re)s?|m|yards?|yd|feet|foot|ft|'|inch(?:es)?|in|")?/g;
  const terms=[];let m,rest=s;while((m=re.exec(s))){if(!m[0].trim())break;terms.push({n:numOf(m[1]),u:unitKey(m[2])});}
  rest=s.replace(re,'').replace(/[\s,+\-x]/g,'');if(rest||!terms.length||terms.some(t=>!isFinite(t.n)))return null;

  if(terms.some(t=>t.u)){let tot=0,last=null;const down={ft:'in',m:'cm',yd:'ft',cm:'mm'};
    for(let i=0;i<terms.length;i++){let u=terms[i].u;if(!u){u=last?down[last]:null;if(!u){const nx=terms.slice(i+1).find(t=>t.u);u=nx?({in:'ft',cm:'m',mm:'cm',ft:'yd'}[nx.u]||nx.u):(metric?'m':'ft');}}tot+=terms[i].n*UNITS[u][0];last=u;}
    return{v:tot,how:''};}
  if(terms.length===2)return metric?{v:terms[0].n*UNITS.m[0]+terms[1].n*UNITS.cm[0],how:'meters and centimeters'}:{v:terms[0].n*12+terms[1].n,how:'feet and inches'};
  if(terms.length>2)return null;
  const n=terms[0].n,r=ref>0?ref:(small?5:120);const cands=metric?(small?['cm','mm']:['m','cm','mm']):(small?['in','ft']:['ft','in']);

  return best;}

function smartAngle(str){const s=String(str||'').trim().toLowerCase().replace(/,/g,'.');let m=s.match(/^(-?\d*\.?\d+)\s*(°|º|d|deg|degs|degrees?)?$/);if(m)return +m[1];
  m=s.match(/^(-?\d*\.?\d+)\s*(r|rad|rads|radians?)$/);if(m)return(+m[1])/deg;return null;}

// ---------- plans & persistence ----------
function normalize(p){p.settings=Object.assign({},DEF_SETTINGS,p.settings||{});p.objects=Array.isArray(p.objects)?p.objects:[];p.name=p.name||'Untitled plan';return p;}

function gridMarkup(W,H){const s=view.s,metric=S().unit==='metric';

  for(let x=x0;x*s+view.x<=W;x+=minor){const sx=Math.round(x*s+view.x)+0.5;const mj=Math.abs(x/major-Math.round(x/major))<1e-6;(mj?(b+=`M${sx} 0V${H}`):(a+=`M${sx} 0V${H}`));}

// ----- wall corner snapping -----
const near=(p,q)=>V.dist(p,q)<0.6;
function wallJoints(w,end){const p=w[end],out=[];for(const x of cur.objects){if(x.type!=='wall'||x===w)continue;if(near(x.a,p))out.push({id:x.id,end:'a',which:end,orig:clone(x)});else if(near(x.b,p))out.push({id:x.id,end:'b',which:end,orig:clone(x)});}return out;}
function wallTargets(ex){const tg=targets(ex);tg.segs=[];for(const o of cur.objects){if(ex.has(o.id))continue;
  if(o.type==='wall')tg.segs.push([o.a,o.b]);else if(o.type==='room'){const n=o.pts.length;for(let i=0;i<n;i++)tg.segs.push([o.pts[i],o.pts[(i+1)%n]]);}}return tg;}

  let best=null,bd=R;for(const q of tg.pts){const d=V.dist(p,q);if(d<bd){bd=d;best=q;}}

  let sb=null,sd=R*0.75;for(const s of tg.segs||[]){const r=projSeg(p,s[0],s[1]);const d=V.dist(p,r.q);if(d<sd&&r.t>0.001&&r.t<0.999){sd=d;sb=r.q;}}

function applyJoints(joints,w){for(const j of joints){const x=clone(j.orig);x[j.end]=[w[j.which][0],w[j.which][1]];replaceObj(x);}}
function wallChains(walls){const used=new Set(),chains=[];
  for(const w of walls){if(used.has(w))continue;used.add(w);const pts=[w.a,w.b];let grow=true;
    while(grow){grow=false;for(const x of walls){if(used.has(x)||(x.t||5)!==(w.t||5)||(x.color||'')!==(w.color||''))continue;const st=pts[0],en=pts[pts.length-1];
      if(near(x.a,en))pts.push(x.b);else if(near(x.b,en))pts.push(x.a);else if(near(x.a,st))pts.unshift(x.b);else if(near(x.b,st))pts.unshift(x.a);else continue;used.add(x);grow=true;}}
    const closed=pts.length>3&&near(pts[0],pts[pts.length-1]);if(closed)pts.pop();chains.push({pts,t:w.t||5,color:w.color,closed});}
  return chains;}
function startMove(o,w){const att=o.type==='room'?attachedTo(o):[];const ex=new Set([o.id,...att.map(a=>a.id)]);
  const joints=o.type==='wall'?[...wallJoints(o,'a'),...wallJoints(o,'b')]:[];joints.forEach(j=>ex.add(j.id));
  op={kind:'move',id:o.id,start:w,orig:clone(o),att:att.map(a=>({id:a.id,orig:clone(a)})),joints,tg:o.type==='wall'?wallTargets(ex):targets(ex),pre:snapState()};}
function doMove(w){if(!op.pushed){pushPre(op.pre);op.pushed=true;}const o=op.orig;const d=V.sub(w,op.start);
  if(o.type==='door'){const p=[o.x+d[0],o.y+d[1]];const h=hostSnap(p,o.w);const n=clone(o);if(h)Object.assign(n,h);else{n.x=p[0];n.y=p[1];if(S().snap){const G=S().grid;n.x=Math.round(n.x/G)*G;n.y=Math.round(n.y/G)*G;}}replaceObj(n);guides=[];render();return;}
  let dx=d[0],dy=d[1];const mp=snapPtsOf(o).map(p=>[p[0]+dx,p[1]+dy]);let g=[];
  if(o.type==='wall'&&S().snap){const R=(COARSE?28:18)/view.s;let bc=null,bd=R;
    for(const e of['a','b']){const p=[o[e][0]+dx,o[e][1]+dy];for(const q of op.tg.pts){const dd=V.dist(p,q);if(dd<bd){bd=dd;bc={c:V.sub(q,p),q};}}}
    if(bc){dx+=bc.c[0];dy+=bc.c[1];const nw=translated(o,dx,dy);replaceObj(nw);applyJoints(op.joints,nw);guides=[{pt:bc.q}];guardFrame([nw.a,nw.b]);render();return;}}
  if(mp.length){const r=alignSnap(mp,op.tg);dx+=r.dx;dy+=r.dy;g=r.g;}else if(S().snap&&(o.type==='text')){const G=S().grid;dx=Math.round((o.x+dx)/G)*G-o.x;dy=Math.round((o.y+dy)/G)*G-o.y;}
  const nw=translated(o,dx,dy);replaceObj(nw);for(const a of op.att)replaceObj(translated(a.orig,dx,dy));if(op.joints&&op.joints.length)applyJoints(op.joints,nw);guides=g;

function startHandle(h,w){const o=selObj();const tg=targets(new Set([o.id]));
  if(o.type==='room'&&h[0]==='v'){const i=+h.slice(1);tg.pts.push(...o.pts.filter((_,j)=>j!==i));}
  if(o.type==='room'&&h[0]==='e'){const i=+h.slice(1);tg.pts.push(...o.pts.filter((_,j)=>j!==i&&j!==(i+1)%o.pts.length));}
  let att=[];if(o.type==='room'&&h[0]==='e'){const i=+h.slice(1),n=o.pts.length;att=cur.objects.filter(d=>d.type==='door'&&projSegDist([d.x,d.y],o.pts[i],o.pts[(i+1)%n])<1).map(d=>({id:d.id,orig:clone(d)}));}
  let joints=[],tgw=tg;if(o.type==='wall'&&(h==='a'||h==='b')){joints=wallJoints(o,h);const ex=new Set([o.id,...joints.map(j=>j.id)]);tgw=wallTargets(ex);
    joints.forEach(j=>tgw.pts.push(j.orig[j.end==='a'?'b':'a']));}
  op={kind:'handle',h,id:o.id,orig:clone(o),start:w,tg:tgw,att,joints,pre:snapState()};
  if(o.type==='room'&&h==='rrot'){op.c=roomCenter(o);op.a0=Math.atan2(w[1]-op.c[1],w[0]-op.c[0]);op.ratt=attachedTo(o).map(clone);}}
function rotPt(p,c,a){const sn=Math.sin(a),k=Math.cos(a),x=p[0]-c[0],y=p[1]-c[1];return[c[0]+x*k-y*sn,c[1]+x*sn+y*k];}
function rotatedObj(orig,c,a){const o=clone(orig),R=p=>{const q=rotPt(p,c,a);return[Math.round(q[0]*100)/100,Math.round(q[1]*100)/100];},d=a/deg;
  switch(o.type){case 'room':case 'pen':o.pts=o.pts.map(R);break;case 'wall':case 'dim':o.a=R(o.a);o.b=R(o.b);break;
    case 'door':{const q=R([o.x,o.y]);o.x=q[0];o.y=q[1];o.ang=normAng(o.ang+d);break;}
    case 'furn':case 'text':{const q=R([o.x,o.y]);o.x=q[0];o.y=q[1];o.rot=normAng((o.rot||0)+d);break;}}
  return o;}
function roomCenter(r){const b=bbox(r.pts);return[(b[0]+b[2])/2,(b[1]+b[3])/2];}
// turn a room (and what sits in it) about its center; quarter turns stay lined up with the grid
function applyRoomTurn(orig,att,c,degs){const a=degs*deg;let n=rotatedObj(orig,c,a),dx=0,dy=0;
  if(S().snap&&Math.abs(((degs%90)+90)%90)<1e-6){const G=S().grid,b=bbox(n.pts);dx=Math.round(b[0]/G)*G-b[0];dy=Math.round(b[1]/G)*G-b[1];}

function turnRoom(o,degs){if(!o||o.type!=='room'||o.locked)return;const pre=snapState();checkpoint();
  const n=applyRoomTurn(clone(o),attachedTo(o).map(clone),roomCenter(o),degs);
  if(hasGeomDims()&&!solveConstraints({pins:new Set(get(n.id).pts)})){restoreState(pre);undoS.pop();toast('Smart dimensions hold this room in place. Change or delete them to turn it.');render();renderInspector();return;}
  changed();}
function projSegDist(p,a,b){return V.dist(projSeg(p,a,b).q,p);}
function doHandle(w){if(!op.pushed){pushPre(op.pre);op.pushed=true;}const h=op.h,o=clone(op.orig);let g=[];
  if(o.type==='room'&&h==='rrot'){let d=(Math.atan2(w[1]-op.c[1],w[0]-op.c[0])-op.a0)/deg;d=((d+540)%360)-180;if(S().snap)d=Math.round(d/15)*15;
    const n=applyRoomTurn(op.orig,op.ratt,op.c,d);op.tip=(d>0?'+':'')+F(d)+'°';guides=[];guardFrame(n.pts);render();return;}
  if(o.type==='room'){const n=o.pts.length;
    if(h[0]==='v'){const sp=snapPoint(w,op.tg);o.pts[+h.slice(1)]=sp.p;g=sp.g;}
    else if(h[0]==='e'){const i=+h.slice(1),a=op.orig.pts[i],b=op.orig.pts[(i+1)%n],u=V.norm(V.sub(b,a)),nn=[-u[1],u[0]];let d=V.dot(V.sub(w,op.start),nn);
      if(S().snap){const sp=snapPoint(V.add(a,V.mul(nn,d)),op.tg);d=V.dot(V.sub(sp.p,a),nn);g=sp.g.filter(x=>!x.pt);}
      o.pts[i]=V.add(a,V.mul(nn,d));o.pts[(i+1)%n]=V.add(b,V.mul(nn,d));for(const at of op.att)replaceObj(translated(at.orig,nn[0]*d,nn[1]*d));}}

    else{const i=+h.slice(1),cs=furnCorners(op.orig),fixed=cs[(i+2)%4];let p=w;const r=(o.rot||0)%90===0;if(r){const sp=snapPoint(w,op.tg);p=sp.p;g=sp.g;}
      const loc=V.rot(V.sub(p,fixed),-(o.rot||0)*deg);const sx=(i===0||i===3)?-1:1,sy=(i<2)?-1:1;

// delete an object; a room takes everything inside it (doors on a wall it shares with another room stay)
function removeObj(o){const gone=new Set([o]);
  if(o.type==='room'&&o.outline){for(const d of cur.objects)if(d.type==='door'&&onEdgeOf(o,[d.x,d.y],1)>=0&&!cur.objects.some(r=>r!==o&&r.type==='room'&&onEdgeOf(r,[d.x,d.y],1)>=0))gone.add(d);}
  else if(o.type==='room'){const others=cur.objects.filter(x=>x.type==='room'&&x!==o);
    for(const a of attachedTo(o)){if(a.type==='door'&&others.some(r=>onEdgeOf(r,[a.x,a.y],1)>=0))continue;gone.add(a);}
    for(const x of cur.objects){if((x.type==='wall'||x.type==='dim')&&inPoly(V.mul(V.add(x.a,x.b),0.5),o.pts)&&!others.some(r=>inPoly(V.mul(V.add(x.a,x.b),0.5),r.pts)))gone.add(x);}}
  checkpoint();cur.objects=cur.objects.filter(x=>!gone.has(x));if(sel&&!get(sel))sel=null;changed();
  const n=gone.size-1;toast(n?`${o.label||typeName(o)} deleted with ${n} item${n>1?'s':''} inside. Undo brings it back.`:`${o.label||typeName(o)} deleted. Undo brings it back.`);}
function startOver(){checkpoint();cur.objects=[];sel=null;changed();setTimeout(fitView,0);toast('Plan cleared. Undo brings it back.');}
function newProject(name){const p=blankPlan(name||'Project '+(Object.keys(plans).filter(k=>!plans[k].example).length+1));plans[p.id]=p;openPlan(p.id);changed();setSheet(true);

  clearTimeout(rTimer);if(COL)pushRemote();toast((wasEx?'Example saved as your project. ':'')+(COL?'Saved to your account':'Saved on this device'));}

      ${p===cur?'<span class="btn on">Open</span>':`<button class="btn" data-m="open" data-id="${p.id}">Open</button>`}<button class="btn" data-m="copy" data-id="${p.id}">Duplicate</button>${p.shared?`<button class="btn" data-m="leave" data-id="${p.id}">${delArm===p.id?'Tap again to leave':'Leave'}</button>`:`<button class="btn danger" data-m="del" data-id="${p.id}">${delArm===p.id?'Tap again to delete':'Delete'}</button>`}</li>`).join('')}</ul>
    ${(DB&&!STANDALONE)||STANDALONE?`<div class="fld"><span class="lbl">Join a shared project</span><div class="copyrow"><input id="join-code" placeholder="Paste a project link or code" autocomplete="off" spellcheck="false"><button class="btn" data-m="join">Join</button></div></div>`:''}
    <div class="sec"><h3>Start over</h3><p class="note">Start a brand-new project and keep this one, or wipe everything off “${esc(cur.name)}”.</p><div class="btns"><button class="btn" data-m="new">New blank project</button><button class="btn danger" data-m="clear">${clearArm?'Tap again to clear':'Clear this plan'}</button></div></div>
    <div class="sec"><h3>Back up</h3><p class="note">One file with every project and your saved furniture. Import it ${STANDALONE?'into the Claude version, or back into this app,':'into the phone app, or back in here,'} to move everything across.</p><div class="btns"><button class="btn" data-m="backup">Back up everything</button><button class="btn" data-m="import">Restore from a file</button></div></div>
    <div class="sec"><h3>Export “${esc(cur.name)}”</h3>${DL||STANDALONE?`<div class="btns"><button class="btn" data-m="png">Picture (PNG)</button><button class="btn" data-m="svg">Drawing (SVG)</button><button class="btn" data-m="json">Plan file (JSON)</button></div><p class="note">A plan file can be imported back here later as a backup.</p>`:'<p class="note">Exporting isn’t available in this view.</p>'}</div>
    <p class="note">${COL?'Plans save to your Claude account and sync between your phone and computer.':STANDALONE?'Projects are saved on this phone. Back up regularly, and use the backup file to move projects to or from your computer.':'Plans are saved in this browser. Open this page signed in to Claude to sync them between devices.'}</p></div></div>`;
  m.hidden=false;}
$('#modal').addEventListener('click',async e=>{if(e.target.id==='modal'){closeModal();return;}const b=e.target.closest('[data-m]');if(!b)return;const a=b.dataset.m,id=b.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'new':closeModal();newProject();toast('New project started. Name it in the panel.');break;
    case 'save':saveNow();openPlansModal();break;
    case 'saveas':{const p=normalize(clone(cur));p.id='p'+rid();p.name=cur.name+' copy';delete p.example;p.updated=Date.now();plans[p.id]=p;openPlan(p.id);changed();closeModal();toast('Saved a copy. You’re now editing “'+p.name+'”');break;}
    case 'clear':{if(!clearArm){clearArm=true;openPlansModal();setTimeout(()=>{clearArm=false;if(!$('#modal').hidden)openPlansModal();},3500);break;}clearArm=false;closeModal();startOver();break;}
    case 'import':$('#import-file').click();break;
    case 'open':openPlan(id);closeModal();break;
    case 'copy':{const p=normalize(clone(plans[id]));p.id='p'+rid();p.name=plans[id].name+' copy';delete p.example;delete p.shared;delete p.owner;p.updated=Date.now();plans[p.id]=p;openPlan(p.id);changed();closeModal();toast('Duplicated');break;}
    case 'leave':{if(delArm!==id){delArm=id;openPlansModal();setTimeout(()=>{if(delArm===id){delArm=null;if(!$('#modal').hidden)openPlansModal();}},3500);break;}delArm=null;await shLeave(id,false);openPlansModal();break;}
    case 'join':{const v=($('#join-code')||{}).value||'';if(STANDALONE?p2pJoin(v):await shJoin(v))closeModal();break;}
    case 'sh-start':await shCreate();break;
    case 'sh-send':{const c=clone(cur);delete c.shared;delete c.code;delete c.meta;delete c.tomb;await save(fname('json'),JSON.stringify({app:'floorplan-sketchpad',version:1,kind:'backup',plans:[c],library:[]},null,1));break;}
    case 'p2p-start':{const n=$('#p2p-name');if(n&&n.value.trim()){myName=n.value.trim().slice(0,40);LS.set('fps.myname',myName);}p2pShare();break;}
    case 'p2p-copy':{const inp=$('#sh-link');try{await navigator.clipboard.writeText(inp.value);toast('Link copied');}catch(e){inp.focus();inp.select();toast('Selected — copy it from here');}break;}
    case 'p2p-native':{try{await navigator.share({title:cur.name,text:'Edit “'+cur.name+'” with me in Floorplan Sketchpad',url:p2pLink(cur.code)});}catch(e){}break;}
    case 'p2p-stop':closeModal();p2pStopSharing();break;
    case 'sh-copy':case 'sh-copycode':{const inp=$(a==='sh-copy'?'#sh-link':'#sh-code');try{await navigator.clipboard.writeText(inp.value);toast('Copied');}catch(e){inp.focus();inp.select();toast('Selected — copy it from here');}break;}
    case 'sh-leave':closeModal();await shLeave(cur.id,false);break;
    case 'sh-del':{const k='all-'+cur.id;if(delArm!==k){delArm=k;openShareModal();setTimeout(()=>{if(delArm===k){delArm=null;if(!$('#modal').hidden&&$('#modal').dataset.k==='share')openShareModal();}},3500);break;}delArm=null;closeModal();await shLeave(cur.id,true);break;}
    case 'del':{if(delArm!==id){delArm=id;openPlansModal();setTimeout(()=>{if(delArm===id){delArm=null;if(!$('#modal').hidden)openPlansModal();}},3500);break;}
      delArm=null;const wasCur=cur&&cur.id===id;delete plans[id];try{localStorage.removeItem(histKey(id));localStorage.removeItem(bgKey(id));}catch(e){}if(COL&&!id.startsWith('x'))COL.doc(id).delete().catch(()=>{});persistLocal();
      if(wasCur){const rest=Object.values(plans).sort((a,b)=>(b.updated||0)-(a.updated||0));if(rest.length)openPlan(rest[0].id);else{const p=blankPlan('My house');plans[p.id]=p;openPlan(p.id);changed();}}
      openPlansModal();toast('Plan deleted');break;}
    case 'png':await exportPNG();break;
    case 'fpi-open':fpiOpen();break;
    case 'fpi-pick':$('#fpi-file').click();break;
    case 'fpi-setlen':fpiSetLen();break;
    case 'fpi-new':fpiImport(false);break;
    case 'fpi-add':fpiImport(true);break;
    case 'svg':await save(fname('svg'),exportSVG());break;
    case 'backup':await save('floorplan-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'floorplan-sketchpad',version:1,kind:'backup',plans:Object.values(plans).filter(p=>!p.example),library:myLib.items},null,1));break;
    case 'json':await save(fname('json'),JSON.stringify({app:'floorplan-sketchpad',version:1,plan:cur},null,1));break;}});
$('#fpi-file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f){if(!FPI)FPI={sens:0.6,keepBg:true};fpiFile(f);}});
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='fpi-cv')fpiPickAt(e);});
$('#modal').addEventListener('keydown',e=>{if(e.target.id==='fpi-len'&&e.key==='Enter'){e.preventDefault();fpiSetLen();}});
$('#modal').addEventListener('dragover',e=>{if($('#modal').dataset.k!=='fpi')return;e.preventDefault();const d=$('#fpi-drop');if(d)d.classList.add('over');});
$('#modal').addEventListener('dragleave',e=>{const d=$('#fpi-drop');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over');});
$('#modal').addEventListener('drop',e=>{if($('#modal').dataset.k!=='fpi')return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)fpiFile(f);});
window.addEventListener('resize',()=>{if(FPI&&FPI.res&&!$('#modal').hidden)fpiDraw();});
$('#modal').addEventListener('change',e=>{if(e.target.id==='fpi-sens'){fpiResens(+e.target.value);return;}if(e.target.id==='fpi-bg'&&FPI){FPI.keepBg=e.target.checked;return;}if(e.target.id==='p2p-name'){myName=e.target.value.trim().slice(0,40);LS.set('fps.myname',myName);if(SH&&SH.mode==='p2p')p2pSendPres(SH);}});
$('#import-file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(d&&Array.isArray(d.plans)){let np=0,nf=0,last=null;for(const raw of d.plans){if(!raw||!Array.isArray(raw.objects))continue;const p=normalize(clone(raw));delete p.example;p.updated=p.updated||Date.now();
        if(!p.id||!/^[\w\-]+$/.test(p.id))p.id='p'+rid();const have=plans[p.id];if(have&&(have.updated||0)>=p.updated)continue;
        plans[p.id]=p;if(cur&&cur.id===p.id)cur=p;last=p;np++;}
      if(Array.isArray(d.library))for(const it of d.library){if(it&&it.id&&!libItem(it.id)&&it.w>0&&it.h>0){myLib.items.push(clone(it));nf++;}}
      if(nf)saveLib();persistLocal();for(const id in plans)if(plans[id].example&&np){delete plans[id];}
      if(COL)Object.values(plans).forEach(p=>{if(!p.example)COL.doc(p.id).set(body(p)).catch(()=>{});});
      if(last&&cur.example)openPlan(last.id);else openPlan(cur.id);closeModal();toast(`Restored ${np} project${np===1?'':'s'} and ${nf} saved furniture item${nf===1?'':'s'}`);e.target.value='';return;}
    const p=normalize(clone(d.plan||d));if(!Array.isArray(p.objects))throw 0;p.id='p'+rid();p.name=(p.name||'Imported plan');delete p.example;p.updated=Date.now();plans[p.id]=p;openPlan(p.id);changed();closeModal();toast('Imported '+p.name);}
    catch(_){toast('That file isn’t a Floorplan Sketchpad plan');}e.target.value='';};rd.readAsText(f);});
function fname(ext){return(cur.name||'plan').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'.'+ext;}
async function localSave(name,data){const ext=name.split('.').pop(),type={png:'image/png',svg:'image/svg+xml',json:'application/json'}[ext]||'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{const file=new File([blob],name,{type});if(COARSE&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
async function save(name,data){if(!DL&&STANDALONE){if(!data){toast('Nothing to export yet');return;}return localSave(name,data);}if(!DL){toast('Exporting isn’t available in this view');return;}if(!data){toast('Nothing to export yet');return;}
  try{await DL.save({filename:name,data});}catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'A save is already waiting for you':'Couldn’t export that file');}}
function exportSVG(){const b=contentBounds();if(!b)return null;const K=resolvedK(),m=30;const bw=b[2]-b[0]+2*m,bh=b[3]-b[1]+2*m;const sc=Math.max(1,Math.min(6,2400/Math.max(bw,bh)));
  const W=Math.round(bw*sc),H=Math.round(bh*sc)+40;
  return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" style="fill:${K.sheet}"/><text x="16" y="26" style="font-family:${K.hand};font-size:20px;fill:${K.ink}">${esc(cur.name)}</text><g transform="translate(${F((m-b[0])*sc)} ${F((m-b[1])*sc+40)}) scale(${sc})">${scene(K,sc,false)}</g></svg>`;}
async function exportPNG(){const s=exportSVG();if(!s){toast('Nothing to export yet');return;}
  try{const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
    c.getContext('2d').drawImage(img,0,0);const blob=await new Promise(r=>c.toBlob(r,'image/png'));await save(fname('png'),blob);}catch(e){toast('Couldn’t make the picture. Try SVG instead.');}}

// ---------- keyboard ----------
addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('input,textarea,select'))return;if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();dup();return;}
  if(mod&&k==='s'){e.preventDefault();saveNow();return;}
  if(mod)return;
  if(k===' '){if(!spaceDown){spaceDown=true;render();}e.preventDefault();return;}
  if(k==='delete'||k==='backspace'){e.preventDefault();if(polyDraft&&polyDraft.length){polyDraft.pop();if(!polyDraft.length)polyDraft=null;updateHint();render();}
    else if(sel)removeObj(selObj());return;}
  if(k==='escape'){if(polyDraft){polyDraft=null;updateHint();render();}else if(libOpen){libOpen=false;renderInspector();}else if(tool!=='select')setTool('select');else if(sel){sel=null;renderInspector();render();}return;}
  if(k==='enter'&&polyDraft){finishPoly();return;}
  const step=e.shiftKey?12:1;const ar={arrowleft:[-step,0],arrowright:[step,0],arrowup:[0,-step],arrowdown:[0,step]}[k];
  if(ar&&sel){e.preventDefault();nudge(ar[0],ar[1]);return;}
  const map={v:'select',h:'pan',r:'room',p:'poly',w:'wall',d:'door',n:'window',f:'furn',s:'stairs',t:'text',m:'measure',x:'sdim',b:'pen',k:'paint'};
  if(map[k]){setTool(map[k]==='measure'?'dim':map[k]);}});
addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;render();}});

// ---------- boot ----------
function boot(){buildTools();const jn=LS.get('fps.joined',null);if(jn&&Array.isArray(jn.ids))joined=jn;const ml=LS.get('fps.lib',null);if(ml&&Array.isArray(ml.items))myLib={items:ml.items,updated:ml.updated||0};let stored=LS.get('fps.plans',{});if(!stored||typeof stored!=='object')stored={};plans={};
  for(const k in stored){if(stored[k]&&Array.isArray(stored[k].objects))plans[k]=normalize(stored[k]);}
  let cid=LS.get('fps.current',null);const ids=Object.keys(plans);
  if(!ids.length){const p=examplePlan();plans[p.id]=p;cid=p.id;}else if(!plans[cid])cid=ids.sort((a,b)=>(plans[b].updated||0)-(plans[a].updated||0))[0];
  openPlan(cid);setTool('select');
  new ResizeObserver(()=>render()).observe($('#stage'));
  if(STANDALONE){const jm=(location.hash||'').match(/^#join-([a-z0-9]{8,20})$/);if(jm){p2pJoin(jm[1]);try{history.replaceState(null,'',location.pathname);}catch(e){}}
    window.addEventListener('online',()=>{if(SH&&SH.mode==='p2p'&&SH.role==='offline')p2pTryHost(SH);});
    window.addEventListener('hashchange',()=>{const h=(location.hash||'').match(/^#join-([a-z0-9]{8,20})$/);if(h)p2pJoin(h[1]);});setSync();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}else initCaps();}
boot();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){const t=document.getElementById('toast');if(t){t.textContent='An update is ready. Close and reopen the app to use it.';t.hidden=false;setTimeout(()=>t.hidden=true,6000);}}});});
}).catch(()=>{});});}
</script>
